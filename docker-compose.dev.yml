name: loyalty-app-dev

# Solo MySQL para desarrollo local (backend con `mvn spring-boot:run`,
# frontend con `npm start`). No usar en producción.
#
#   docker compose -f docker-compose.dev.yml up -d

services:
  db:
    image: mysql:8.0
    container_name: loyalty-db-dev
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-loyalty_db}
      MYSQL_USER: ${MYSQL_USER:-loyalty_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-loyalty_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    ports:
      - "${DB_EXPOSED_PORT:-3307}:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql_dev_data:
