<!doctype html>
<html lang="es" data-theme="light-neumorphic">
<head>
  <meta charset="utf-8">
  <title>Loyalty Card · Recompensas que te hacen volver</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Loyalty">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    // Anti-FOUC: aplica el tema persistido antes del primer paint.
    (function () {
      try {
        var mode = localStorage.getItem('loyalty.theme') || 'system';
        var themes = ['light-neumorphic', 'dark-purple', 'sage-mist', 'deep-ocean', 'warm-ember'];
        var theme;
        if (mode === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark-purple'
            : 'light-neumorphic';
        } else if (themes.indexOf(mode) !== -1) {
          theme = mode;
        } else if (mode === 'dark') {
          theme = 'dark-purple';
        } else {
          theme = 'light-neumorphic';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themeMode = mode;
      } catch (e) {
        document.documentElement.dataset.theme = 'light-neumorphic';
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
