<div class="auth-page">
  <div class="auth-card fade-in">
    <div class="auth-brand">
      <img *ngIf="logoUrl" class="auth-brand-logo" [src]="logoUrl" alt="" />
      <div class="auth-logo">{{ businessName || ('APP.NAME' | translate) }}</div>
    </div>
    <p class="auth-tagline">{{ 'APP.TAGLINE' | translate }}</p>

    <div *ngIf="error" class="alert alert-error">{{ error }}</div>

    <div class="form-group">
      <label class="form-label" for="login-email">{{ 'AUTH.EMAIL' | translate }}</label>
      <input id="login-email" type="email" class="form-control" [(ngModel)]="email"
             autocomplete="email" />
    </div>
    <div class="form-group">
      <label class="form-label" for="login-password">{{ 'AUTH.PASSWORD' | translate }}</label>
      <input id="login-password" type="password" class="form-control" [(ngModel)]="password"
             autocomplete="current-password" (keydown.enter)="onLogin()" />
    </div>

    <button class="btn btn-primary btn-full btn-lg" type="button"
            [disabled]="loading" (click)="onLogin()">
      {{ loading ? ('COMMON.LOADING' | translate) : ('AUTH.SIGN_IN' | translate) }}
    </button>

    <p class="auth-link">
      {{ 'AUTH.NO_ACCOUNT' | translate }}
      <a [routerLink]="['/', slug, 'register']">{{ 'AUTH.SIGN_UP' | translate }}</a>
    </p>
  </div>
</div>
