<div class="auth-page">
  <div class="auth-card fade-in">
    <div class="auth-logo">{{ 'APP.NAME' | translate }}</div>
    <p class="auth-tagline">{{ 'PLATFORM.LOGIN_TITLE' | translate }}</p>

    <div *ngIf="error" class="alert alert-error">{{ error }}</div>

    <div class="form-group">
      <label class="form-label" for="platform-email">{{ 'AUTH.EMAIL' | translate }}</label>
      <input id="platform-email" type="email" class="form-control" [(ngModel)]="email"
             autocomplete="email" />
    </div>
    <div class="form-group">
      <label class="form-label" for="platform-password">{{ 'AUTH.PASSWORD' | translate }}</label>
      <input id="platform-password" type="password" class="form-control" [(ngModel)]="password"
             autocomplete="current-password" (keydown.enter)="login()" />
    </div>

    <button class="btn btn-primary btn-full btn-lg" type="button"
            [disabled]="loading" (click)="login()">
      {{ loading ? ('COMMON.LOADING' | translate) : ('AUTH.SIGN_IN' | translate) }}
    </button>
  </div>
</div>
