<div class="auth-page">
  <div class="auth-card fade-in">
    <div class="auth-brand">
      <img *ngIf="logoUrl" class="auth-brand-logo" [src]="logoUrl" alt="" />
      <div class="auth-logo">{{ businessName || ('APP.NAME' | translate) }}</div>
    </div>
    <p class="auth-tagline">{{ 'AUTH.JOIN_US' | translate }}</p>

    <div *ngIf="error" class="alert alert-error">{{ error }}</div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="register-first">{{ 'AUTH.FIRST_NAME' | translate }}</label>
        <input id="register-first" class="form-control" [(ngModel)]="form.firstName"
               autocomplete="given-name" />
      </div>
      <div class="form-group">
        <label class="form-label" for="register-last">{{ 'AUTH.LAST_NAME' | translate }}</label>
        <input id="register-last" class="form-control" [(ngModel)]="form.lastName"
               autocomplete="family-name" />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="register-email">{{ 'AUTH.EMAIL' | translate }}</label>
      <input id="register-email" type="email" class="form-control" [(ngModel)]="form.email"
             autocomplete="email" />
    </div>
    <div class="form-group">
      <label class="form-label" for="register-phone">{{ 'AUTH.PHONE' | translate }}</label>
      <input id="register-phone" type="tel" class="form-control" [(ngModel)]="form.phone"
             autocomplete="tel" />
    </div>
    <div class="form-group">
      <label class="form-label" for="register-password">{{ 'AUTH.PASSWORD' | translate }}</label>
      <input id="register-password" type="password" class="form-control" [(ngModel)]="form.password"
             autocomplete="new-password" />
    </div>

    <button class="btn btn-primary btn-full btn-lg" type="button"
            [disabled]="loading" (click)="onRegister()">
      {{ loading ? ('COMMON.LOADING' | translate) : ('AUTH.SIGN_UP' | translate) }}
    </button>

    <p class="auth-link">
      {{ 'AUTH.HAS_ACCOUNT' | translate }}
      <a [routerLink]="['/', slug, 'login']">{{ 'AUTH.SIGN_IN' | translate }}</a>
    </p>
  </div>
</div>
