spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway migrations are MySQL-specific (ENUM, generated columns, CHECK).
# Test scope relies on Hibernate DDL; real migrations are verified by scripts/verify-migrations.sh.
spring.flyway.enabled=false
spring.sql.init.mode=never

app.jwt.secret=test-only-secret-key-0123456789abcdef0123456789abcdef
app.jwt.expiration=86400000
app.cors.allowed-origins=http://localhost:4200
app.bootstrap.platform-admin-email=
app.bootstrap.platform-admin-password=

