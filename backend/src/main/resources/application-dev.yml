spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/loyalty_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:loyalty_user}
    password: ${SPRING_DATASOURCE_PASSWORD:loyalty_pass}
  jpa:
    show-sql: false

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.loyalty: DEBUG
    org.hibernate.SQL: DEBUG
