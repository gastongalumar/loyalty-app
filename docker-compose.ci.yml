version: '3.9'

# MySQL efímero para verificar migraciones (local y CI).
# No se usa para desarrollo: ver docker-compose.yml.

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ci-root-pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-loyalty_ci}
      MYSQL_USER: ${MYSQL_USER:-loyalty_ci}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ci-pass}
    ports:
      - "3307:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-ci-root-pass}"]
      interval: 3s
      timeout: 3s
      retries: 30
