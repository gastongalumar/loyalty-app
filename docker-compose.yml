name: loyalty-app

services:

  # ── MySQL (solo red interna) ─────────────────────────────────
  db:
    image: mysql:8.0
    container_name: loyalty-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-loyalty_db}
      MYSQL_USER: ${MYSQL_USER:-loyalty_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - loyalty_net

  # ── Spring Boot (solo red interna) ───────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loyalty-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-loyalty_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-loyalty_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-86400000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://loyalty.programandos.site}
      APP_BOOTSTRAP_PLATFORM_ADMIN_EMAIL: ${APP_BOOTSTRAP_PLATFORM_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_PLATFORM_ADMIN_PASSWORD: ${APP_BOOTSTRAP_PLATFORM_ADMIN_PASSWORD:-}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    expose:
      - "8080"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 90s
    networks:
      - loyalty_net

  # ── Angular + Nginx (único puerto publicado) ─────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loyalty-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8090}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - loyalty_net

volumes:
  mysql_data:
  uploads_data:

networks:
  loyalty_net:
    driver: bridge
